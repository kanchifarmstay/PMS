<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4a7c59"/>
      <stop offset="100%" stop-color="#2E4632"/>
    </radialGradient>
    <filter id="soft-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Background circle (safe zone for Instagram circle crop) -->
  <circle cx="540" cy="540" r="540" fill="url(#bg)"/>

  <!-- Subtle leaf pattern dots -->
  <circle cx="200" cy="200" r="6" fill="rgba(255,255,255,0.08)"/>
  <circle cx="880" cy="180" r="4" fill="rgba(255,255,255,0.08)"/>
  <circle cx="150" cy="850" r="8" fill="rgba(255,255,255,0.06)"/>
  <circle cx="900" cy="900" r="5" fill="rgba(255,255,255,0.08)"/>
  <circle cx="100" cy="540" r="10" fill="rgba(255,255,255,0.05)"/>
  <circle cx="980" cy="540" r="7" fill="rgba(255,255,255,0.05)"/>

  <!-- Decorative ring -->
  <circle cx="540" cy="540" r="420" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="540" cy="540" r="390" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Bed icon (simplified) -->
  <g filter="url(#soft-shadow)" transform="translate(540,440)">
    <!-- Bed frame -->
    <rect x="-160" y="-40" width="320" height="120" rx="16" fill="rgba(255,255,255,0.15)"/>
    <!-- Headboard -->
    <rect x="-160" y="-90" width="80" height="60" rx="10" fill="rgba(255,255,255,0.2)"/>
    <!-- Pillow -->
    <rect x="-140" y="-70" width="60" height="40" rx="8" fill="rgba(255,255,255,0.35)"/>
    <!-- Pillow 2 -->
    <rect x="80" y="-90" width="80" height="60" rx="10" fill="rgba(255,255,255,0.2)"/>
    <rect x="80" y="-70" width="60" height="40" rx="8" fill="rgba(255,255,255,0.35)"/>
    <!-- Blanket -->
    <rect x="-100" y="-10" width="260" height="70" rx="12" fill="rgba(255,255,255,0.25)"/>
    <!-- Legs -->
    <rect x="-140" y="80" width="20" height="30" rx="4" fill="rgba(255,255,255,0.2)"/>
    <rect x="120" y="80" width="20" height="30" rx="4" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Label -->
  <text x="540" y="640" font-family="Georgia, serif" font-size="72" font-weight="700"
        fill="white" text-anchor="middle" letter-spacing="2">The Stay</text>

  <!-- Tagline -->
  <text x="540" y="700" font-family="Arial, sans-serif" font-size="32"
        fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="1">Rooms &amp; Spaces</text>

  <!-- Brand -->
  <text x="540" y="820" font-family="Arial, sans-serif" font-size="26"
        fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="3">KANCHI FARM STAY</text>
</svg>
